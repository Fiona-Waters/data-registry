name: API documentation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.4.1
          cache: npm
      - run: npm ci
      - run: npm run api:lint
      - run: npm run api:docs
      - name: Check generated API reference
        run: |
          git ls-files --error-unmatch api-contract/data-registry-api.html
          git diff --exit-code -- api-contract/data-registry-api.html
