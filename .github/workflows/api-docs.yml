name: API documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.1
          cache: npm
      - run: npm ci
      - run: npm run api:lint
      - run: npm run api:docs
      - name: Check generated API reference
        run: git diff --exit-code -- api-contract/data-registry-api.html
